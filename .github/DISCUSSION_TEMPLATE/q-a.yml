title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Use this for **how-to and support**.

        - **Wishlist** (new capability) → [open a Wishlist post](https://github.com/opendcl/community/discussions/new?category=wishlist)
        - **Bug** (already exists, misbehaves) → [report a bug](https://github.com/opendcl/OpenDCL/issues/new?template=bug.yml)
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do? Include CAD host and OpenDCL version when relevant.
    validations:
      required: true
